[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens-audit"
version = "0.1.6"
description = "Structured security and architecture reviews for any repository"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "RepoLens contributors" }]
keywords = ["security", "architecture", "code-review", "cli", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "grimp>=3.4,<4",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "tree-sitter>=0.24,<0.27",
  "tree-sitter-language-pack>=0.9,<2",
]
# Meta extra: Semgrep via pip; also run `repolens plugins install` for gitleaks/osv binaries.
scanners = [
  "semgrep==1.181.0",
]
graph = [
  "tree-sitter>=0.24,<0.27",
  "tree-sitter-language-pack>=0.9,<2",
]
local-ml = [
  "sentence-transformers>=3.0,<7",
]
mcp = [
  "mcp>=1.0,<3",
]
architecture = [
  "PyYAML>=6.0",
]
vertex = [
  "google-auth>=2.0",
]
bedrock = [
  "botocore>=1.34",
]

[project.scripts]
repolens = "repolens.cli:run"
repolens-mcp = "repolens.mcp.server:main"

[project.urls]
Homepage = "https://github.com/vksvicky/RepoLens"
Documentation = "https://github.com/vksvicky/RepoLens/tree/main/docs"
Repository = "https://github.com/vksvicky/RepoLens"
Issues = "https://github.com/vksvicky/RepoLens/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repolens = [
  "playbooks/*.md",
  "rules/defaults/*.md",
  "rules/defaults/*.json",
  "packs/**/*.md",
  "architecture/schemas/*.json",
  "plugin_locks/*.txt",
  "plugin_locks/*.json",
  "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." so `from tests.…` works when cwd is not on sys.path (e.g. PYTHONSAFEPATH / CI).
pythonpath = ["src", "."]

[tool.coverage.run]
branch = true
source = ["repolens"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Typer Option/Argument defaults are intentional

[tool.ruff.lint.per-file-ignores]
"scripts/generate_learn_file_notes.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["repolens"]
mypy_path = "src"
