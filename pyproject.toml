[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "0.1.0a1"
description = "Structured security and architecture reviews for any repository"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "RepoLens contributors" }]
keywords = ["security", "architecture", "code-review", "cli", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
# Meta extra: Semgrep via pip; also run `repolens plugins install` for gitleaks/osv binaries.
scanners = [
  "semgrep>=1.100,<2",
]
local-ml = [
  "sentence-transformers>=3.0,<4",
]

[project.scripts]
repolens = "repolens.cli:run"

[project.urls]
Homepage = "https://github.com/vksvicky/RepoLens"
Documentation = "https://github.com/vksvicky/RepoLens/tree/main/docs"
Repository = "https://github.com/vksvicky/RepoLens"
Issues = "https://github.com/vksvicky/RepoLens/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repolens = [
  "playbooks/*.md",
  "rules/defaults/*.md",
  "rules/defaults/*.json",
  "packs/**/*.md",
  "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Typer Option/Argument defaults are intentional

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["repolens"]
mypy_path = "src"
