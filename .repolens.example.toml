# Security note: project-local [model] provider/base_url/api_key_env are IGNORED
# unless you pass --trust-project-config (prevents untrusted-repo exfiltration).
# Safe project overrides: model name, report_dir (relative only).
#
# Example config for the RepoLens CLI (Phases 1–4).
# CLI runtime: Python 3.11+
# Copy to ~/.config/repolens/config.toml or ./.repolens.toml and fill in values.
# Do not commit real secrets.
#
# Target languages (what you review): see docs/faq.md — source-agnostic with
# first-class JS/TS, Python, Go, JVM, C#, Ruby, PHP, Rust, Swift (+ IaC).

[general]
# default_mode = "review"   # review | sentinel | architecture
# report_dir = "reports"

[model]
# provider = "openai"       # or anthropic | deepseek | ollama | ...
# model = "gpt-4.1"
# api_key_env = "OPENAI_API_KEY"   # BYOK — never commit real keys
# For local/self-sufficient: provider = "ollama", model = "qwen2.5:7b", base_url = "http://127.0.0.1:11434/v1"
# timeout_seconds = 900     # HTTP wait for one LLM call (ollama default 900; cloud 120)
# Also: export REPOLENS_TIMEOUT=1800  or  repolens review --timeout 1800

[scanners]
# enabled = ["gitleaks", "semgrep", "osv"]   # detect if on PATH or cache
# require = false                             # if true, exit 2 when a scanner is missing

[local_learning]
# enabled = false           # opt-in; data stays on disk (see docs/local-learning.md)
# cache_dir = ".repolens"   # also requires: repolens learn build --accept-local-learning

[adaptive]
# enabled = true            # Phase 5: fingerprint cache in .repolens/repolens.sqlite
# mode = "auto"             # auto | full | changed
# timeout_margin = 1.3
# min_timeout_seconds = 120
# max_timeout_seconds = 3600

[deep]
# enabled = true            # Multi-pass deep coverage (default on for LLM runs)
# chars_per_pass = 100000   # Max file-size budget (bytes) packed into each pass
# mega_file_lines = 500     # Heuristic LOC threshold for mega-file findings
# mega_file_exclude_globs = ["**/*.md", "**/docs/**", "**/xcuserdata/**", "**/*.xcuserstate", "**/*.pbxproj"]
# CLI: --deep / --no-deep (None → this config; --no-deep restores single-shot)

[sources]
# Private remotes: env tokens (also accepts GH_TOKEN for GitHub),
# then fall back to `gh auth token` if available.
# github_token_env = "GITHUB_TOKEN"
# bitbucket_token_env = "BITBUCKET_TOKEN"
# hf_token_env = "HF_TOKEN"

[review]
# require_code_examples_for = ["critical", "high"]
# priority_order = ["p1", "p2", "p3"]
