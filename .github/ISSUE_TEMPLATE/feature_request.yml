name: Feature request
description: Suggest an improvement to RepoLens
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Check [phases.md](https://github.com/vksvicky/RepoLens/blob/main/docs/phases.md) so we can place this in the right phase.
  - type: dropdown
    id: phase
    attributes:
      label: Best-fit phase
      options:
        - Docs / playbooks
        - Core CLI
        - Remotes
        - Scanner plugins
        - CI / Action / packaging
        - Local learning
        - Other / next phase
        - Unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: mode
    attributes:
      label: Related modes
      options:
        - label: `repolens review` (full)
        - label: `repolens sentinel` (security-only)
        - label: `repolens architecture`
        - label: `repolens export`
        - label: Playbooks only
