name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-sanity:
    name: Docs sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required files exist
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            docs/README.md
            docs/phases.md
            docs/faq.md
            docs/design/cli-and-report-schema.md
            docs/design/ai-keys-scanners-and-local-learning.md
            docs/adr/README.md
            docs/adr/_diagram_legend.md
            docs/adr/01_analysis_runtime_architecture.md
            docs/CHANGELOG.md
            docs/CONTRIBUTING.md
            docs/CODE_OF_CONDUCT.md
            docs/SECURITY.md
            docs/SUPPORT.md
            docs/using-playbooks.md
            docs/setup-ai-and-scanners.md
            docs/remote-sources.md
            docs/scanners.md
            docs/ci.md
            docs/publishing.md
            docs/try-on-your-repo.md
            docs/install-extras.md
            docs/local-learning.md
            docs/design/phase-2-multi-source-ingest.md
            docs/design/phase-3-scanners.md
            docs/design/phase-4-ci-and-ecosystem.md
            docs/design/phase-5-adaptive-cache-and-recommendations.md
            docs/design/phase-6-enterprise-ci-and-report-delivery.md
            action.yml
            playbooks/security.md
            playbooks/architecture.md
            pyproject.toml
            src/repolens/cli.py
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
          echo "All required foundation files present."

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q
