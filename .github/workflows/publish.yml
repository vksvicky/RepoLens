# Publish to PyPI on version tags (v*) using Trusted Publishing (OIDC).
# One-time setup: see docs/publishing.md
name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build + package (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build

      # Same gates as ci.yml — refuse to publish a tag that would fail CI.
      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        # Pin commit (v1.14.2); bump deliberately — do not use floating tags.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
